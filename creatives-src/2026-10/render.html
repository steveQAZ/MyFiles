@font-face{font-family:M;src:url(montserrat.woff2) format("woff2");font-weight:100 900}
/* ===== EWS creative system — fixed on every graphic =====
   Margin 64px on all sides. Type: kicker 22 · title 76 · subtext 28 · CTA 26 · label 22 · footer 24 · numeral 200 */
:root{--M:64px;--navy:#2A3852;--slate:#3C5072;--deep:#1C1F26;--g:#84C73D;--w:#FEFEFE;--l:#D0D9E8;--gun:#434853}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:M,sans-serif;color:var(--w)}
.art{position:relative;overflow:hidden;background:var(--navy);margin:20px;display:block}
.sq{width:1080px;height:1080px}.pt{width:1080px;height:1350px}.st{width:1080px;height:1920px}
.a{position:absolute}
.box{position:absolute;overflow:hidden}
.pic{display:block;width:100%;height:100%;object-fit:cover}
.logo{position:absolute;width:150px;height:auto}
.k{font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.t{font-weight:900;font-size:76px;line-height:1;letter-spacing:-.005em;text-transform:uppercase;color:var(--w)}
.t .g{color:var(--g)}.t span{display:block}
.s{font-weight:400;font-size:28px;line-height:1.45;color:#E6ECF5}
.cta{position:absolute;display:inline-block;background:var(--g);color:var(--deep);font-weight:800;font-size:26px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;padding:22px 32px;white-space:nowrap}
.f{font-weight:400;font-size:24px;line-height:1.45;color:#E6ECF5}.f span{display:block}
.n{font-weight:900;font-size:200px;line-height:.85;letter-spacing:-.03em;color:var(--g)}
.lbl{font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:var(--w)}
.chip{display:inline-block;border:2px solid rgba(208,217,232,.4);padding:12px 18px;font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.08em;text-transform:uppercase}
.chip.on{border-color:var(--g);color:var(--g)}
.mono{font-family:"DejaVu Sans Mono",monospace;font-size:28px;line-height:1.55}
.grid{background-image:linear-gradient(rgba(208,217,232,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(208,217,232,.07) 1px,transparent 1px),linear-gradient(rgba(208,217,232,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(208,217,232,.12) 1px,transparent 1px);background-size:36px 36px,36px 36px,180px 180px,180px 180px}
.lat{background-image:repeating-linear-gradient(45deg,rgba(208,217,232,.07) 0 1px,transparent 1px 44px),repeating-linear-gradient(-45deg,rgba(208,217,232,.07) 0 1px,transparent 1px 44px)}
.dots{background-image:radial-gradient(rgba(208,217,232,.16) 1.6px,transparent 1.8px);background-size:28px 28px}
.lines{background-image:repeating-linear-gradient(0deg,rgba(208,217,232,.06) 0 1px,transparent 1px 22px)}
.cut{display:block;max-width:none}
.tick{display:flex;gap:18px;align-items:flex-start}.tick i{flex:none;width:18px;height:18px;background:var(--g);margin-top:12px}

/* ===== v3: cut-out subjects floating over layered brand backgrounds ===== */
const CM = window.CUTMETA;
const shadow = "filter:drop-shadow(0 28px 36px rgba(0,0,0,.5)) drop-shadow(0 6px 10px rgba(0,0,0,.35))";
/* place a cut-out by height (h) or width (w); never stretched: the other side follows the cut-out's own ratio */
function cut(k,x,y,{h,w,st="",cls="",base=0,card=0}){const m=CM[k];if(h==null)h=Math.round(w*m.h/m.w);if(w==null)w=Math.round(h*m.w/m.h);
 return `<img class="cut ${cls}" data-k="${k}" data-base="${base?1:0}" data-card="${card?1:0}" src="cut/${k}.png" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${shadow};${st}">`}
const cw=(k,h)=>Math.round(h*CM[k].w/CM[k].h), ch=(k,w)=>Math.round(w*CM[k].h/CM[k].w);
const glow=(cx,cy,r,op=.35)=>`<div class="a" style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px;background:radial-gradient(circle,rgba(132,199,61,${op}),rgba(132,199,61,0) 65%)"></div>`;
const floor=(cx,y,w,op=.55)=>`<div class="a" style="left:${cx-w/2}px;top:${y-22}px;width:${w}px;height:44px;background:radial-gradient(ellipse at center,rgba(0,0,0,${op}),rgba(0,0,0,0) 70%)"></div>`;
const arc=(cx,cy,r,a0,a1,col="#84C73D",sw=4,op=.9)=>{const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${Math.abs(a1-a0)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round"/>`};
const tag=(x,y,t,st="")=>`<div class="a lbl" style="left:${x}px;top:${y}px;background:#FEFEFE;color:#1C1F26;padding:10px 16px;box-shadow:0 14px 24px rgba(0,0,0,.35);${st}">${t}</div>`;
const bgNavy=(extra="")=>`<div class="a" style="inset:0;background:radial-gradient(120% 90% at 70% 30%,#34466A 0%,#2A3852 45%,#1F2A40 100%)"></div>${extra}`;

/* ===== v4: pop-out photos (background removed only above the subject) + big brand graphics ===== */
const PM = window.POPMETA;
const shadow4 = "filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 6px 12px rgba(0,0,0,.3))";
function pop(k,x,y,{h,w,st="",base=0}){const m=PM[k];if(h==null)h=Math.round(w*m.h/m.w);if(w==null)w=Math.round(h*m.w/m.h);
 return `<img class="cut" data-k="${k}" data-base="${base?1:0}" src="pop/${k}.png" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${shadow4};${st}">`}
const pw=(k,h)=>Math.round(h*PM[k].w/PM[k].h), phh=(k,w)=>Math.round(w*PM[k].h/PM[k].w);
const G={
 /* concentric brand rings: slate band, green line, deep core */
 rings:(cx,cy,r)=>svg(W,2000,`<defs><radialGradient id="rg${cx}${cy}"><stop offset="0" stop-color="#3C5072"/><stop offset="1" stop-color="#2A3852"/></radialGradient></defs>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#rg${cx}${cy})"/><circle cx="${cx}" cy="${cy}" r="${r+34}" stroke="#84C73D" stroke-width="10"/>
  <circle cx="${cx}" cy="${cy}" r="${r+90}" stroke="#3C5072" stroke-width="44" stroke-opacity=".7"/><circle cx="${cx}" cy="${cy}" r="${r+170}" stroke="#D0D9E8" stroke-opacity=".12" stroke-width="3"/>`),
 /* solid Apple Green disc */
 disc:(cx,cy,r,op=1)=>svg(W,2000,`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#84C73D" fill-opacity="${op}"/><circle cx="${cx}" cy="${cy}" r="${r+26}" stroke="#84C73D" stroke-opacity=".35" stroke-width="4"/>`),
 /* giant signal bars */
 bars:(x,base,bw,gap,hmax)=>svg(W,2000,[0,1,2,3].map(i=>`<rect x="${x+i*(bw+gap)}" y="${base-hmax*(i+1)/4}" width="${bw}" height="${hmax*(i+1)/4}" fill="${i==3?"#84C73D":"#3C5072"}"/>`).join("")),
 /* giant RF broadcast: thick arcs from a point */
 broadcast:(cx,cy,r0,step,n=4)=>svg(W,2000,Array.from({length:n},(_,i)=>`<path d="M${cx-(r0+i*step)*.7} ${cy-(r0+i*step)*.7}A${r0+i*step} ${r0+i*step} 0 0 1 ${cx+(r0+i*step)*.7} ${cy-(r0+i*step)*.7}" stroke="${i%2?"#3C5072":"#84C73D"}" stroke-width="${i%2?46:22}" stroke-linecap="round"/>`).join("")+`<circle cx="${cx}" cy="${cy}" r="${r0*.45}" fill="#84C73D"/>`),
 /* big hexagon, slate fill with green edge */
 hex:(cx,cy,r)=>{const p=[...Array(6)].map((_,i)=>{const a=Math.PI/3*i-Math.PI/2;return `${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`}).join(" ");const p2=[...Array(6)].map((_,i)=>{const a=Math.PI/3*i-Math.PI/2;return `${(cx+(r+40)*Math.cos(a)).toFixed(1)},${(cy+(r+40)*Math.sin(a)).toFixed(1)}`}).join(" ");return svg(W,2000,`<polygon points="${p}" fill="#3C5072"/><polygon points="${p2}" stroke="#84C73D" stroke-width="8"/>`)},
 /* giant sine band */
 band:(y,amp,len,th)=>{let d=`M0 ${y}`;for(let x=0;x<=W;x+=8)d+=` L${x} ${(y+Math.sin(x/len*2*Math.PI)*amp).toFixed(1)}`;return svg(W,2000,`<path d="${d}" stroke="#3C5072" stroke-width="${th}"/><path d="${d}" stroke="#84C73D" stroke-width="10" transform="translate(0 ${th/2+14})"/>`)},
 /* big green slab, slanted */
 slab:(x0,x1,y0,y1,sk=80)=>svg(W,2000,`<polygon points="${x0+sk},${y0} ${x1+sk},${y0} ${x1-sk},${y1} ${x0-sk},${y1}" fill="#84C73D"/>`),
 /* EWS tower mark, huge and faint */
 mark:(x,y,w,op=.1)=>`<img src="logo-white.svg" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;opacity:${op}">`
};
