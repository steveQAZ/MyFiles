<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:M,sans-serif;color:var(--w)}
.art{position:relative;overflow:hidden;background:var(--navy);margin:20px;display:block}

.k{font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}

.hl{font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:-.005em}

.sub{font-weight:700;font-size:34px;line-height:1.25}
.body{font-weight:400;font-size:29px;line-height:1.45;color:#E6ECF5}
.cta{display:inline-block;background:var(--g);color:var(--deep);font-weight:800;font-size:28px;letter-spacing:.06em;text-transform:uppercase;padding:24px 36px;white-space:nowrap}
.foot{font-weight:400;font-size:27px;line-height:1.45;color:#E6ECF5}
.foot span{display:block}
.chip{display:inline-block;border:2px solid rgba(208,217,232,.35);padding:12px 20px;font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;color:var(--w)}
.chip.on{border-color:var(--g);color:var(--g)}
.grid{background-image:linear-gradient(rgba(208,217,232,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(208,217,232,.07) 1px,transparent 1px),linear-gradient(rgba(208,217,232,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(208,217,232,.12) 1px,transparent 1px);background-size:36px 36px,36px 36px,180px 180px,180px 180px}
.lat{background-image:repeating-linear-gradient(45deg,rgba(208,217,232,.07) 0 1px,transparent 1px 44px),repeating-linear-gradient(-45deg,rgba(208,217,232,.07) 0 1px,transparent 1px 44px)}
.dots{background-image:radial-gradient(rgba(208,217,232,.16) 1.6px,transparent 1.8px);background-size:28px 28px}
.lines{background-image:repeating-linear-gradient(0deg,rgba(208,217,232,.06) 0 1px,transparent 1px 22px)}
.bar{height:10px;background:var(--g)}
.mono{font-family:"DejaVu Sans Mono",monospace}
.num{font-weight:900;line-height:.85;letter-spacing:-.03em}
.outline{color:transparent;-webkit-text-stroke:3px var(--g)}
.tick{display:flex;gap:18px;align-items:flex-start;font-size:29px;line-height:1.35;color:#E6ECF5}
.tick i{flex:none;width:22px;height:22px;background:var(--g);margin-top:8px}
</style></head><body><div id="out"></div>

const hl=(a,b,px,extra="")=>`<div class="hl" style="font-size:${px}px;${extra}"><div class="fit">${esc(a)}</div><div class="fit g">${esc(b)}</div></div>`;

const ph=(k,pos="center",st="")=>`<div class="fill ph" style="background-image:url(ph/${k}.jpg);background-position:${pos};${st}"></div>`;
function svg(w,h,inner,st=""){return `<svg class="abs" style="left:0;top:0;${st}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">${inner}</svg>`}
function arcs(cx,cy,n,step,r0=40,col="#D0D9E8",op=.14,sw=2){let s="";for(let i=0;i<n;i++)s+=`<circle cx="${cx}" cy="${cy}" r="${r0+i*step}" stroke="${col}" stroke-opacity="${(op*(1-i/(n+2))).toFixed(3)}" stroke-width="${sw}"/>`;return s}
function wave(w,y,amp,len,col="#84C73D",op=1,sw=3,ph=0){let d=`M0 ${y}`;for(let x=0;x<=w;x+=8)d+=` L${x} ${(y+Math.sin(x/len*2*Math.PI+ph)*amp).toFixed(1)}`;return `<path d="${d}" stroke="${col}" stroke-opacity="${op}" stroke-width="${sw}"/>`}
function contour(cx,cy,n,step,seed=1,op=.12){let s="";for(let i=1;i<=n;i++){let d="";for(let a=0;a<=360;a+=6){const r=i*step*(1+.12*Math.sin(a*Math.PI/180*3+seed+i*.7)+.06*Math.sin(a*Math.PI/180*5+seed*2));const x=cx+r*Math.cos(a*Math.PI/180),y=cy+r*Math.sin(a*Math.PI/180);d+=(a?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)}s+=`<path d="${d}Z" stroke="#D0D9E8" stroke-opacity="${(op*(1-i/(n+3))).toFixed(3)}" stroke-width="2"/>`}return s}
const bars=(n=4,on=4,x=0,y=0,s=1)=>{let o="";for(let i=0;i<n;i++){const h=(i+1)*14*s;o+=`<rect x="${x+i*16*s}" y="${y+56*s-h}" width="${10*s}" height="${h}" fill="${i<on?"#84C73D":"#D0D9E8"}" fill-opacity="${i<on?1:.25}"/>`}return o};

 const box=(on)=>`<span style="flex:none;width:64px;height:64px;border:5px solid var(--g);display:grid;place-items:center;background:${on?"var(--g)":"transparent"}">${on?`<svg width="38" height="38" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="#1C1F26" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</span>`;
 out.push(slideShell("c30-1",0,T,`${ph("c30","center 50%")}<div class="fill" style="background:rgba(28,31,38,.55)"></div>
  ${logo(60,56)}
  <div class="abs" style="left:90px;top:300px;width:900px;background:#FEFEFE;color:var(--deep);padding:60px 56px;box-shadow:0 40px 80px rgba(0,0,0,.4)">

   <div class="hl" style="font-size:96px;color:#2A3852;margin-top:14px"><div>Inspection</div><div style="color:#5E9E1C">checklist</div></div>

 CHK.forEach((q,i)=>out.push(slideShell(`c30-${i+2}`,i+1,T,`<div class="abs dots" style="inset:0"></div>
  <div class="abs" style="left:60px;top:80px;display:flex;gap:14px">${CHK.map((_,j)=>`<span style="width:48px;height:48px;border:4px solid ${j<=i?"#84C73D":"rgba(208,217,232,.3)"};background:${j<i?"#84C73D":"transparent"}"></span>`).join("")}</div>
  <div class="abs num" style="left:52px;top:220px;font-size:200px;color:var(--g)">0${i+1}</div>
  <div class="abs" style="left:60px;top:470px;width:960px;display:flex;gap:34px;align-items:flex-start">${box(0)}<div class="sub" style="font-size:62px;line-height:1.12">${esc(q)}</div></div>
  <div class="abs" style="left:60px;top:920px;width:960px;background:var(--slate);padding:36px 40px;border-left:0">
   <div style="display:flex;align-items:center;gap:14px;font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--g)"><svg width="30" height="30">${arcs(15,15,3,5,3,"#84C73D",1,2)}</svg>WHY IT MATTERS</div>
   <div class="body" style="margin-top:14px;font-size:32px">${TIPS[i]}</div></div>`)));
 out.push(slideShell("c30-7",6,T,`<div class="abs ph" style="left:0;top:0;width:1080px;height:600px;background-image:url(ph/c30.jpg);background-position:center 50%"></div>
  <div class="abs" style="left:60px;top:540px;width:120px;height:120px;background:var(--g);display:grid;place-items:center"><svg width="70" height="70" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" stroke="#1C1F26" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="abs" style="left:60px;top:720px">${hl("Missing a","checkmark?",104)}</div>
  <div class="abs body" style="left:60px;top:960px;width:900px">We can take care of it, from survey to the yearly test.</div>
  <div class="abs" style="left:60px;top:1080px"><span class="cta">Let's talk coverage</span></div>`));
 return out.join("")};

/* fit headline lines to their box */
document.fonts.ready.then(()=>{document.querySelectorAll(".hl").forEach(h=>{const box=h.parentElement.getBoundingClientRect();const art=h.closest(".art").getBoundingClientRect();const maxW=Math.min(h.getBoundingClientRect().width||box.width,art.right-h.getBoundingClientRect().left-50);h.querySelectorAll(":scope>div").forEach(line=>{let fs=parseFloat(getComputedStyle(h).fontSize);line.style.display="inline-block";while(line.getBoundingClientRect().width>maxW&&fs>30){fs-=2;line.style.fontSize=fs+"px"}line.style.display="block"})});document.body.dataset.ready=1});
