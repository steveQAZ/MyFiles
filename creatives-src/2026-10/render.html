/* ===== v5: full photos in their own section, blended into the text side =====
   Depth stack, back to front: navy base + pattern -> graded photo section with gradient fade
   -> brand overlay crossing the seam (glow) -> frosted glass cards with deep shadows -> text. */
const NAT = window.PHOTOS;   // natural sizes + detected faces per photo
/* ph5: uniform scale only (cover), focal point (fx,fy) placed at (ax,ay) of the box, then clamped so the photo always covers it.
   fade: [[side,len],...] gradient mask from transparent at that edge to solid after len px. */
function ph5(k,{x,y,w,h},{fx=.5,fy=.5,ax=.5,ay=.5,zoom=1,fade=[],grade=1,tint="",st=""}={}){
 const n=NAT[k],s=Math.max(w/n.w,h/n.h)*zoom,iw=n.w*s,ih=n.h*s;
 let ix=ax*w-fx*iw,iy=ay*h-fy*ih;ix=Math.min(0,Math.max(w-iw,ix));iy=Math.min(0,Math.max(h-ih,iy));
 const dir={l:"to right",r:"to left",t:"to bottom",b:"to top"};
 const m=fade.map(([sd,len])=>`linear-gradient(${dir[sd]},transparent 0,rgba(0,0,0,.55) ${Math.round(len*.45)}px,#000 ${len}px)`).join(",");
 const mask=m?`-webkit-mask-image:${m};mask-image:${m};-webkit-mask-composite:source-in;mask-composite:intersect;`:"";
 return `<div class="box ph5" data-fade='${JSON.stringify(fade)}' style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${mask}${st}">
  <img data-k="${k}" src="ph/${k}.jpg" style="position:absolute;left:${ix.toFixed(1)}px;top:${iy.toFixed(1)}px;width:${iw.toFixed(1)}px;height:${ih.toFixed(1)}px;max-width:none">
  ${grade?`<div class="a" style="inset:0;background:linear-gradient(180deg,rgba(28,31,38,.18),rgba(28,31,38,.42));mix-blend-mode:multiply"></div><div class="a" style="inset:0;background:rgba(42,56,82,.22);mix-blend-mode:soft-light"></div>`:""}
  ${tint?`<div class="a" style="inset:0;${tint}"></div>`:""}</div>`}
/* glass card: frosted panel floating above the photo edge */
const glass=(x,y,inner,st="")=>`<div class="a glass occ" style="left:${x}px;top:${y}px;${st}">${inner}</div>`;
/* seam glow: soft light spill where photo meets navy */
const spill=(cx,cy,r,col="132,199,61",op=.22)=>`<div class="a" style="left:${cx-r}px;top:${cy-r}px;width:${2*r}px;height:${2*r}px;background:radial-gradient(circle,rgba(${col},${op}),rgba(${col},0) 65%);mix-blend-mode:screen"></div>`;
/* glowing brand line art over everything behind the text */
const glowsvg=(w,h,inner,st="")=>svg(w,h,inner,`filter:drop-shadow(0 0 8px rgba(132,199,61,.55));${st}`);
const base=(pat="grid",st="")=>`<div class="a" style="inset:0;background:radial-gradient(110% 90% at 20% 20%,#34466A 0%,#2A3852 45%,#1C2334 100%)"></div><div class="a ${pat}" style="inset:0;${st}"></div>`;
const pill=(t,on)=>`<span class="lbl" style="display:inline-flex;align-items:center;gap:10px"><i style="width:12px;height:12px;border-radius:50%;background:${on?"#84C73D":"#D03030"};box-shadow:0 0 12px ${on?"#84C73D":"#D03030"}"></i>${t}</span>`;

const only=(location.hash||"").slice(1);
document.getElementById("out").innerHTML=order.filter(k=>!only||only.split(",").includes(k)).map(k=>D[k]()).join("");

/* ===== QA: margins, overlaps, overflow, fixed sizes, photo quality, one photo per post ===== */
const SIZE={k:22,t:76,s:28,cta:26,f:24,n:200,lbl:22,chip:22};
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{
 const qa=[];
 document.querySelectorAll(".art").forEach(art=>{
  const id=art.dataset.id,A=art.getBoundingClientRect(),H=A.height;
  const els=[...art.querySelectorAll(".k,.t,.s,.cta,.f,.n,.lbl,.chip,.logo,.mono")];
  const R=e=>{const r=e.getBoundingClientRect();return{x:r.left-A.left,y:r.top-A.top,r:r.right-A.left,b:r.bottom-A.top}};
  els.forEach(e=>{const r=R(e);const nm=e.className.split(" ").find(c=>SIZE[c]||c=="logo"||c=="mono")||e.className;
   if(r.x<M-1||r.y<M-1||r.r>W-M+1||r.b>H-M+1)qa.push(`${id}: ${nm} "${e.textContent.trim().slice(0,24)}" outside margin (${r.x|0},${r.y|0},${r.r|0},${r.b|0})`);
   if(e.scrollWidth>e.clientWidth+2&&!e.classList.contains("cta"))qa.push(`${id}: ${nm} text overflows its box`);
   for(const c in SIZE)if(e.classList.contains(c)){const fs=parseFloat(getComputedStyle(e).fontSize);if(Math.abs(fs-SIZE[c])>.5)qa.push(`${id}: ${c} is ${fs}px, not ${SIZE[c]}px`)}});
  for(let i=0;i<els.length;i++)for(let j=i+1;j<els.length;j++){const a=els[i],b=els[j];if(a.contains(b)||b.contains(a))continue;const p=R(a),q=R(b);
   const G=8;if(p.x<q.r+G&&q.x<p.r+G&&p.y<q.b+G&&q.y<p.b+G)qa.push(`${id}: too close "${a.textContent.trim().slice(0,18)||a.className}" × "${b.textContent.trim().slice(0,18)||b.className}"`)}
  const keys=new Set();art.querySelectorAll("img[data-k]").forEach(im=>{keys.add(im.dataset.k);const r=im.getBoundingClientRect(),sc=Math.max(r.width/im.naturalWidth,r.height/im.naturalHeight);if(sc>1.25)qa.push(`${id}: photo ${im.dataset.k} upscaled ${sc.toFixed(2)}x (${im.naturalWidth}px source)`)});
  art.dataset.photos=[...keys].join(",");
 });
 /* one photo per post: a carousel's slides must not repeat a photo */
 const byPost={};document.querySelectorAll(".art").forEach(a=>{const post=a.dataset.id.split("-")[0];(a.dataset.photos||"").split(",").filter(Boolean).forEach(k=>{(byPost[post]=byPost[post]||[]).push(k)})});
 for(const p in byPost){const l=byPost[p];if(new Set(l).size!==l.length)qa.push(`${p}: a photo is used more than once`)}
 /* v5: faces and heads fully inside the solid part of their photo section, never under text or cards */
 document.querySelectorAll(".art").forEach(art=>{const id=art.dataset.id,A=art.getBoundingClientRect(),H=A.height;
  const top=[...art.querySelectorAll(".k,.t,.s,.cta,.f,.n,.lbl,.chip,.logo,.mono,.occ")].map(e=>{const r=e.getBoundingClientRect();return{e,x:r.left-A.left,y:r.top-A.top,r:r.right-A.left,b:r.bottom-A.top}});
  art.querySelectorAll(".ph5").forEach(bx=>{const im=bx.querySelector("img"),k=im.dataset.k,n=PHOTOS[k],B=bx.getBoundingClientRect(),I=im.getBoundingClientRect();
   const bx0=B.left-A.left,by0=B.top-A.top,bx1=B.right-A.left,by1=B.bottom-A.top;let sx0=bx0,sy0=by0,sx1=bx1,sy1=by1;
   JSON.parse(bx.dataset.fade).forEach(([sd,len])=>{if(sd=="l")sx0=bx0+len*.7;if(sd=="r")sx1=bx1-len*.7;if(sd=="t")sy0=by0+len*.7;if(sd=="b")sy1=by1-len*.7});
   const s=I.width/n.w;
   n.faces.forEach(f=>{const fx=I.left-A.left+f[0]*s,fy=I.top-A.top+f[1]*s,fw=f[2]*s,fh=f[3]*s;const hx=fx-fw*.15,hy=fy-fh*.6,hr=fx+fw*1.15,hb=fy+fh;
    if(hr<bx0||hx>bx1||hb<by0||hy>by1)return; /* face cropped away entirely: not in the post */
    if(hx<Math.max(sx0,0)-1||hy<Math.max(sy0,0)-1||hr>Math.min(sx1,W)+1||hb>Math.min(sy1,H)+1)qa.push(`${id}: face in ${k} is cropped or faded (${hx|0},${hy|0},${hr|0},${hb|0})`);
    top.forEach(t=>{if(t.x<hr&&hx<t.r&&t.y<hb&&hy<t.b)qa.push(`${id}: "${t.e.textContent.trim().slice(0,16)||t.e.className}" covers a face in ${k}`)})})})});
 window.QA=qa;document.body.dataset.ready=1});
</script></body></html>
